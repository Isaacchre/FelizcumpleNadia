<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosaico Denso BT21 Mejorado</title>
    <style>
        :root {
            --tile-size: 80px;
        }

        body, html {
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #0b0b0b; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #mosaic-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            flex-wrap: wrap; 
            z-index: 999;
            transition: opacity 0.8s ease;
        }

        .tile {
            width: var(--tile-size); 
            height: var(--tile-size);
            background-size: 70%;
            background-position: center;
            background-repeat: no-repeat;
            filter: invert(1) brightness(90%);
            transform-origin: center;
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Efectos distintos pulidos para asegurar que lleguen a opacity: 0 */
        .anim-1 { transform: rotate(720deg) scale(0); opacity: 0; filter: invert(1) blur(10px); }
        .anim-2 { transform: translateY(-100vh) scale(0.2); opacity: 0; }
        .anim-3 { transform: translateX(100vw) scale(0.2); opacity: 0; }
        .anim-4 { transform: scale(3) rotate(-45deg); opacity: 0; filter: invert(1) blur(20px); }

        #content { 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            flex-direction: column;
            opacity: 0;
            animation: fadeIn 2s forwards 1.5s; 
        }

        #content h1 { 
            font-size: 4rem; 
            margin: 0; 
            text-shadow: 0 0 20px rgba(255,255,255,0.3); 
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="mosaic-overlay"></div>
    
    <div id="content">
        <h1>Bienvenido</h1>
    </div>

    <script>
        // Conservamos los paths originales de los iconos
        const iconPaths = [
            'icons8-bt21-chimmy-50.svg', 'icons8-bt21-cooky-50.svg', 
            'icons8-bt21-koya-50.svg', 'icons8-bt21-mang-50.svg', 
            'icons8-bt21-rj-50.svg', 'icons8-bt21-shooky-50.svg', 
            'icons8-bt21-tata-50.svg', 'icons8-bt21-van-50.svg'
        ];

        const container = document.getElementById('mosaic-overlay');

        // Cálculo dinámico de íconos requeridos
        function generateTiles() {
            const tileSize = 80;
            const cols = Math.ceil(window.innerWidth / tileSize);
            const rows = Math.ceil(window.innerHeight / tileSize);
            const totalTiles = cols * rows;

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < totalTiles; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                const randomIcon = iconPaths[Math.floor(Math.random() * iconPaths.length)];
                tile.style.backgroundImage = `url('${randomIcon}')`;
                fragment.appendChild(tile);
            }

            container.appendChild(fragment);
            return Array.from(document.querySelectorAll('.tile'));
        }

        window.addEventListener('load', () => {
            const tiles = generateTiles();

            tiles.forEach((tile) => {
                const randomAnim = 'anim-' + (Math.floor(Math.random() * 4) + 1);
                const randomDelay = Math.random() * 1500; // Máximo de 1.5s de retraso
                
                setTimeout(() => {
                    tile.classList.add(randomAnim);
                }, randomDelay); 
            });

            // Oculta el contenedor completo suavemente y luego remueve el nodo del DOM
            setTimeout(() => {
                container.style.opacity = '0';
                setTimeout(() => container.remove(), 800);
            }, 2800);
        });
    </script>
</body>
</html>
